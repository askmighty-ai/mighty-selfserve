<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 300px;
      background: #fff;
      color: #1a1a1a;
    }

    .header {
      background: #7c3aed;
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header img { width: 24px; height: 24px; border-radius: 4px; }
    .header-text h1 { font-size: 15px; font-weight: 600; }
    .header-text p  { font-size: 11px; opacity: 0.8; margin-top: 1px; }

    .body { padding: 14px 16px; }

    .status-box {
      background: #f5f3ff;
      border: 1px solid #ede9fe;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: #5b21b6;
      margin-bottom: 14px;
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-box.error { background: #fef2f2; border-color: #fecaca; color: #991b1b; }

    label {
      font-size: 11px;
      font-weight: 500;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: block;
      margin-bottom: 5px;
    }

    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 10px;
    }
    input:focus { border-color: #7c3aed; box-shadow: 0 0 0 2px #ede9fe; }

    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      margin-bottom: 8px;
    }
    .btn-primary { background: #7c3aed; color: white; }
    .btn-primary:hover:not(:disabled) { background: #6d28d9; }
    .btn-secondary { background: #f3f4f6; color: #374151; }
    .btn-secondary:hover:not(:disabled) { background: #e5e7eb; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .divider { border: none; border-top: 1px solid #f0f0f0; margin: 12px 0; }

    .footer {
      padding: 10px 16px 14px;
      display: flex;
      gap: 8px;
    }
    .footer a {
      flex: 1;
      text-align: center;
      font-size: 12px;
      color: #7c3aed;
      text-decoration: none;
      padding: 7px;
      border: 1px solid #ede9fe;
      border-radius: 6px;
    }
    .footer a:hover { background: #f5f3ff; }

    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid #c4b5fd;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="M">
    <div class="header-text">
      <h1>Mighty Sync</h1>
      <p>Account dashboard syncer</p>
    </div>
  </div>

  <div class="body">
    <div class="status-box" id="status-box">
      <span id="spinner" class="spinner hidden"></span>
      <span id="status-text">Loading…</span>
    </div>

    <label>API Key</label>
    <input type="password" id="api-key" placeholder="mk_…" autocomplete="off">
    <button class="btn btn-primary" id="save-btn">Save Key</button>
    <button class="btn btn-secondary" id="sync-btn" disabled>Sync Now</button>
  </div>

  <hr class="divider">

  <div class="footer">
    <a href="https://mighty-selfserve-production.up.railway.app" target="_blank">Open Dashboard</a>
    <a href="https://mighty-selfserve-production.up.railway.app/credentials" target="_blank">Manage Accounts</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
