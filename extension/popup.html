<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 280px;
      background: #fff;
      color: #1a1a1a;
    }

    .header {
      background: #7c3aed;
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header img { width: 24px; height: 24px; border-radius: 5px; }
    .header-text h1 { font-size: 15px; font-weight: 700; }
    .header-text p  { font-size: 11px; opacity: 0.7; margin-top: 1px; }

    .body {
      padding: 20px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .status-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #d1d5db;
    }
    .status-dot.active  { background: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.15); }
    .status-dot.warning { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,0.15); }
    .status-dot.error   { background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.15); }
    .status-label { font-size: 13px; font-weight: 600; color: #111827; }
    .status-sub   { font-size: 11px; color: #9ca3af; margin-top: 1px; }

    .last-sync {
      font-size: 11.5px;
      color: #9ca3af;
      text-align: center;
      line-height: 1.4;
    }
    .last-sync strong { color: #6b7280; }

    .btn-dashboard {
      display: block;
      width: 100%;
      padding: 11px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background 0.15s;
      font-family: inherit;
    }
    .btn-dashboard:hover { background: #6d28d9; }

    .setup-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      color: #92400e;
      line-height: 1.5;
      text-align: center;
    }
    .setup-box a { color: #b45309; font-weight: 600; text-decoration: none; }
    .setup-box a:hover { text-decoration: underline; }

    .auto-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 11px;
      color: #9ca3af;
    }
    .auto-badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes spin  { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="header">
    <img src="icons/icon48.png" alt="M">
    <div class="header-text">
      <h1>Mighty Sync</h1>
      <p>Running in the background</p>
    </div>
  </div>

  <div class="body">

    <div class="status-row" id="status-row">
      <div class="status-dot" id="status-dot"></div>
      <div>
        <div class="status-label" id="status-label">Loading…</div>
        <div class="status-sub"  id="status-sub"></div>
      </div>
    </div>

    <!-- Shown only when no API key -->
    <div class="setup-box hidden" id="setup-box">
      Visit your <a href="https://mighty-selfserve-production.up.railway.app/extension-setup" target="_blank">Mighty dashboard</a> in Chrome and the extension will configure itself automatically.
    </div>

    <!-- Shown when configured -->
    <div class="last-sync hidden" id="last-sync-row"></div>

    <div class="auto-badge hidden" id="auto-badge">
      <div class="auto-badge-dot"></div>
      Auto-capturing account pages as you browse
    </div>

    <a class="btn-dashboard" href="https://mighty-selfserve-production.up.railway.app/dashboard" target="_blank">
      Open Dashboard →
    </a>

  </div>

  <script src="popup.js"></script>
</body>
</html>
