<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 280px;
      background: #fff;
      color: #1a1a1a;
    }

    .header {
      background: #7c3aed;
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header img { width: 24px; height: 24px; border-radius: 5px; }
    .header-text h1 { font-size: 15px; font-weight: 700; }
    .header-text p  { font-size: 11px; opacity: 0.7; margin-top: 1px; }

    .body {
      padding: 16px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Status card ── */
    .status-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .status-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #d1d5db;
    }
    .status-dot.green  { background: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.15); }
    .status-dot.amber  { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,0.15); }
    .status-dot.red    { background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.15); }
    .status-dot.pulse  { animation: pulse 1.6s ease-in-out infinite; }
    .status-label { font-size: 13px; font-weight: 600; color: #111827; }

    .status-detail {
      font-size: 11.5px;
      color: #6b7280;
      line-height: 1.5;
      padding-left: 16px;  /* align with label text */
    }
    .status-detail .dim { color: #9ca3af; }

    /* ── Setup box ── */
    .setup-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      color: #92400e;
      line-height: 1.5;
      text-align: center;
    }
    .setup-box a { color: #b45309; font-weight: 600; text-decoration: none; }
    .setup-box a:hover { text-decoration: underline; }

    /* ── Buttons ── */
    .btn-dashboard {
      display: block;
      width: 100%;
      padding: 11px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background 0.15s;
      font-family: inherit;
    }
    .btn-dashboard:hover { background: #6d28d9; }

    .btn-reset {
      display: block;
      width: 100%;
      padding: 9px;
      background: transparent;
      color: #ef4444;
      border: 1px solid #fca5a5;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s;
      font-family: inherit;
    }
    .btn-reset:hover { background: #fef2f2; }

    .hidden { display: none !important; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>
</head>
<body>

  <div class="header">
    <img src="icons/icon48.png" alt="M">
    <div class="header-text">
      <h1>Mighty Sync</h1>
      <p id="header-sub">Background sync active</p>
    </div>
  </div>

  <div class="body">

    <!-- Status card — shows current sync state and last result -->
    <div class="status-card" id="status-card">
      <div class="status-top">
        <div class="status-dot" id="status-dot"></div>
        <div class="status-label" id="status-label">Loading…</div>
      </div>
      <div class="status-detail hidden" id="status-detail"></div>
    </div>

    <!-- Shown only when no API key -->
    <div class="setup-box hidden" id="setup-box">
      Visit your <a href="https://mighty-selfserve-production.up.railway.app/extension-setup" target="_blank">Mighty dashboard</a> in Chrome and the extension will configure itself automatically.
    </div>

    <!-- Shown only when sync is stuck (>5 min with lock held) -->
    <button class="btn-reset hidden" id="reset-sync-btn">Reset stuck sync</button>

    <a class="btn-dashboard" href="https://mighty-selfserve-production.up.railway.app/dashboard" target="_blank">
      Open Dashboard →
    </a>

  </div>

  <script src="popup.js"></script>
</body>
</html>
