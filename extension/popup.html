<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 280px;
      background: #fff;
      color: #1a1a1a;
    }

    .header {
      background: #7c3aed;
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header img { width: 24px; height: 24px; border-radius: 5px; }
    .header-text h1 { font-size: 15px; font-weight: 700; }
    .header-text p  { font-size: 11px; opacity: 0.7; margin-top: 1px; }
    .header-role {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0.85;
      margin-top: 2px;
    }

    .body {
      padding: 16px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Status card ── */
    .status-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .status-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #d1d5db;
    }
    .status-dot.green  { background: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.15); }
    .status-dot.amber  { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,0.15); }
    .status-dot.red    { background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.15); }
    .status-dot.pulse  { animation: pulse 1.6s ease-in-out infinite; }
    .status-label { font-size: 13px; font-weight: 600; color: #111827; }

    .status-detail {
      font-size: 11.5px;
      color: #6b7280;
      line-height: 1.5;
      padding-left: 16px;  /* align with label text */
    }
    .status-detail .dim { color: #9ca3af; }

    /* ── Progress bar ── */
    .progress-wrap {
      padding-left: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .progress-track {
      height: 4px;
      background: #e5e7eb;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #a78bfa, #7c3aed);
      background-size: 200% 100%;
      border-radius: 2px;
      transition: width 0.6s ease;
      width: 0%;
      animation: shimmer 1.6s linear infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .progress-label {
      font-size: 11px;
      color: #9ca3af;
    }

    /* ── Setup box ── */
    .setup-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      color: #92400e;
      line-height: 1.5;
      text-align: center;
    }
    .setup-box a { color: #b45309; font-weight: 600; text-decoration: none; }
    .setup-box a:hover { text-decoration: underline; }

    .model-line {
      font-size: 11px;
      color: #6b7280;
      line-height: 1.45;
      text-align: center;
    }

    /* ── Buttons ── */
    .btn-dashboard {
      display: block;
      width: 100%;
      padding: 11px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background 0.15s;
      font-family: inherit;
    }
    .btn-dashboard:hover { background: #6d28d9; }


    .hidden { display: none !important; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>
</head>
<body>

  <div class="header">
    <img src="icons/icon48.png" alt="M">
    <div class="header-text">
      <h1 id="header-title">Mighty</h1>
      <div class="header-role">Worker · Chrome</div>
      <p id="header-sub">Running in Chrome</p>
    </div>
  </div>

  <div class="body">

    <!-- Status card — shows current activity and last result -->
    <div class="status-card" id="status-card">
      <div class="status-top">
        <div class="status-dot" id="status-dot"></div>
        <div class="status-label" id="status-label">Loading…</div>
      </div>
      <div class="status-detail hidden" id="status-detail"></div>
      <!-- Progress bar — shown only during active update -->
      <div class="progress-wrap hidden" id="progress-wrap">
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-label" id="progress-label"></div>
      </div>
    </div>

    <p class="model-line" id="model-line">Login is the only manual step. Everything else is automatic.</p>

    <!-- Shown only when no API key -->
    <div class="setup-box hidden" id="setup-box">
      Visit your <a href="https://mighty-selfserve-production.up.railway.app/extension-setup" target="_blank">control center</a> in Chrome — the worker configures itself automatically.
    </div>

    <a class="btn-dashboard" id="dashboard-btn" href="https://mighty-selfserve-production.up.railway.app/account-center" target="_blank">
      Open Account Center
    </a>

  </div>

  <script src="popup.js"></script>
</body>
</html>
