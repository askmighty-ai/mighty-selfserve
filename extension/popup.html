<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 280px;
      background: #fff;
      color: #1a1a1a;
    }

    .header {
      background: #7c3aed;
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header img { width: 24px; height: 24px; border-radius: 5px; }
    .header-text h1 { font-size: 15px; font-weight: 700; }
    .header-text p  { font-size: 11px; opacity: 0.85; margin-top: 2px; }

    .body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .status-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .status-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #10b981;
      box-shadow: 0 0 0 3px rgba(16,185,129,0.15);
    }
    .status-dot.amber {
      background: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245,158,11,0.15);
    }
    .status-label { font-size: 13px; font-weight: 600; color: #111827; }
    .status-detail {
      font-size: 11.5px;
      color: #6b7280;
      line-height: 1.5;
      padding-left: 16px;
    }

    .setup-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      color: #92400e;
      line-height: 1.5;
      text-align: center;
    }
    .setup-box a { color: #b45309; font-weight: 600; text-decoration: none; }
    .setup-box a:hover { text-decoration: underline; }

    .btn-dashboard {
      display: block;
      width: 100%;
      padding: 11px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background 0.15s;
      font-family: inherit;
    }
    .btn-dashboard:hover { background: #6d28d9; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="header">
    <img src="icons/icon48.png" alt="M">
    <div class="header-text">
      <h1 id="header-title">Mighty</h1>
      <p id="header-sub">Working in the background</p>
    </div>
  </div>

  <div class="body">

    <div class="status-card" id="status-card">
      <div class="status-top">
        <div class="status-dot" id="status-dot"></div>
        <div class="status-label" id="status-label">Keeping your accounts up to date</div>
      </div>
      <div class="status-detail hidden" id="status-detail"></div>
    </div>

    <div class="setup-box hidden" id="setup-box">
      Visit your <a href="https://mighty-selfserve-production.up.railway.app/extension-setup" target="_blank">Account Center</a> to connect the worker.
    </div>

    <a class="btn-dashboard" id="dashboard-btn" href="https://mighty-selfserve-production.up.railway.app/account-center" target="_blank">
      Open Account Center
    </a>

  </div>

  <script src="popup.js"></script>
</body>
</html>
