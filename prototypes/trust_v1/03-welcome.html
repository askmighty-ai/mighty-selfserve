<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to Mighty</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <header class="container">
      <div class="mkt-header">
        <a class="brand" href="01-landing.html">
          <span class="brand-mark" aria-hidden="true"></span>
          Mighty
        </a>
      </div>
    </header>

    <main class="center-stage">
      <div class="onboard-card surface surface-pad-lg rise" style="text-align: center;">
        <div class="step-rail" style="justify-content: center;" aria-label="Progress">
          <span class="is-done">✓</span>
          <span class="is-active">2</span>
          <span>3</span>
          <span style="width:auto;border:0;background:transparent;color:var(--muted);font-weight:500;">Welcome</span>
        </div>

        <div class="welcome-mark" aria-hidden="true">
          <svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M20 7L10 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <h1 class="display display-md">Welcome to Mighty</h1>
        <p class="lede" style="margin: 0.75rem auto 0; font-size: 1.05rem;">
          Your account is ready. Next we’ll show how Mighty works, then help you find the accounts you already have —
          with no surprise permissions.
        </p>

        <div style="margin-top: 1.75rem;">
          <a class="btn btn-primary btn-lg" href="04-how-mighty-works.html">Continue</a>
        </div>

        <p class="small muted" style="margin-top: 1.15rem;">
          <a href="05-connect-gmail.html">I already know how this works</a>
          — you’ll still get a short privacy preface before connecting.
        </p>
      </div>
    </main>
  </div>
</body>
</html>
